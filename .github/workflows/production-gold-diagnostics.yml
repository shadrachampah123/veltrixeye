# Production Gold (XAUUSD / v8) diagnostics — READ-ONLY.
#
# WHAT THIS DOES
#   Runs `scripts/diagnostics/gold-v8-production-evidence.ts` against the
#   production database and uploads the resulting evidence report as a build
#   artifact. It exists to establish, from production data, the ACTUAL v8 4H
#   liquidity-sweep `timeframe_role` and `anchorOffsetCandles`, the
#   authoritative XAUUSD pip size, the candle coverage evaluation can read, and
#   the setup/alert/delivery evidence that exists — so that any correction is
#   proposed from evidence and never from assumption.
#
# WHAT THIS DELIBERATELY CANNOT DO
#   * It is `workflow_dispatch` ONLY. No push, pull_request, schedule or
#     workflow_call trigger: it never runs on its own and nothing else can
#     invoke it.
#   * LEAST PRIVILEGE: the job grants itself `contents: read` and NOTHING else
#     — no `packages: write`, no `id-token: write`, no `pull-requests: write`,
#     no `actions: write`. It cannot open or merge a PR, publish a package, or
#     mint a cloud token.
#   * The only secret it reads is `DATABASE_URL`. It is passed through `env`,
#     immediately masked with `::add-mask::`, and never echoed, printed,
#     written to the report or exposed to a third-party action. The diagnostic
#     script additionally redacts connection strings, `password=`, bearer
#     tokens and e-mail addresses from everything it prints.
#   * NO TRADING: it never constructs an execution or risk service, and no
#     broker/transport credential exists in this repository's CI surface.
#   * NO SCANNER EXECUTION: it does not construct `ScannerService` and performs
#     no `scanner/trigger` call; it only SELECTs the scanner ledger.
#   * NO NOTIFICATION DELIVERY: it does not construct `NotificationWorker` and
#     calls no delivery route; it only SELECTs `notification_deliveries`.
#   * NO DATABASE MUTATION: the script opens its pool with the startup option
#     `-c default_transaction_read_only=on` and runs every query inside a
#     single `BEGIN READ ONLY` … `ROLLBACK`. The report records the enforced
#     setting and the connecting role's effective write privileges as proof.
#   * Only first-party actions are used (actions/checkout, actions/setup-node,
#     actions/upload-artifact). No third-party action is asked to handle the
#     secret.
#
# OPERATION
#   Actions → "Production Gold diagnostics (read-only)" → Run workflow.
#   Requires the repository secret `DATABASE_URL` to exist. If it does not, the
#   run fails fast with an explicit message and NOTHING is attempted — no
#   credential is invented, guessed or defaulted.

name: Production Gold diagnostics (read-only)

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Strategy name substring (or a full strategy UUID)'
        required: false
        default: 'gold'
      version:
        description: 'Strategy version_number to inspect'
        required: false
        default: '8'
      symbol:
        description: 'Instrument symbol'
        required: false
        default: 'XAUUSD'
      asset_class:
        description: 'Instrument asset class'
        required: false
        default: 'commodity'

# Least privilege: read the repo to check it out, and nothing else.
permissions:
  contents: read

# One diagnostic at a time; a manual re-run supersedes an in-flight one.
concurrency:
  group: production-gold-diagnostics
  cancel-in-progress: false

jobs:
  evidence:
    name: Collect v8/XAUUSD evidence (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The ONLY secret this workflow touches. Never echoed, never persisted.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_MODE: require
      DATABASE_POOL_MAX: '2'

    steps:
      - name: Verify the read-only database secret is configured
        # No `set -x`: this step must never trace the value into the log.
        run: |
          set -euo pipefail
          # Belt and braces on top of GitHub's automatic secret masking: register
          # the value as a mask for every later step in this job.
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "::add-mask::${DATABASE_URL}"
          fi
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error title=Missing required secret::DATABASE_URL"
            {
              echo "### Required repository secret is not configured"
              echo ""
              echo "This workflow reads the production database through a repository secret named exactly:"
              echo ""
              echo "\`\`\`"
              echo "DATABASE_URL"
              echo "\`\`\`"
              echo ""
              echo "It must hold a connection string for a role whose ONLY grants on the production"
              echo "database are SELECT on:"
              echo ""
              echo "\`schema_migrations\`, \`strategies\`, \`strategy_versions\`, \`strategy_timeframes\`,"
              echo "\`strategy_rule_groups\`, \`strategy_conditions\`, \`strategy_risk_config\`,"
              echo "\`strategy_market_scopes\`, \`strategy_market_scope_instruments\`,"
              echo "\`strategy_session_filters\`, \`strategy_filters\`, \`instruments\`,"
              echo "\`instrument_risk_specs\`, \`candles\`, \`setups\`, \`setup_state_events\`,"
              echo "\`setup_scores\`, \`alerts\`, \`alert_deliveries\`, \`notification_deliveries\`,"
              echo "\`scanner_runs\`, \`scanner_cursors\`."
              echo ""
              echo "The role must NOT hold INSERT/UPDATE/DELETE on any of them, must not own the"
              echo "tables and must not be a superuser. No credential is invented, defaulted or"
              echo "guessed, and the secret's value is never printed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "DATABASE_URL is configured (value masked and never printed)."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: |
          set -euo pipefail
          npm ci

      - name: Run read-only production diagnostic
        id: diagnostic
        # No `set -x`: the environment here carries the secret.
        #
        # The dispatch inputs are passed through `env` and quoted — NEVER
        # interpolated as `${{ inputs.* }}` into the shell — so a crafted input
        # cannot inject shell syntax into this step.
        env:
          DIAG_STRATEGY: ${{ inputs.strategy }}
          DIAG_VERSION: ${{ inputs.version }}
          DIAG_SYMBOL: ${{ inputs.symbol }}
          DIAG_ASSET_CLASS: ${{ inputs.asset_class }}
        run: |
          set -euo pipefail
          case "$DIAG_VERSION" in
            ''|*[!0-9]*) echo "::error title=Invalid input::version must be a positive integer, got '$DIAG_VERSION'"; exit 1 ;;
          esac
          mkdir -p diagnostics-out
          npx tsx scripts/diagnostics/gold-v8-production-evidence.ts \
            --strategy "$DIAG_STRATEGY" \
            --version "$DIAG_VERSION" \
            --symbol "$DIAG_SYMBOL" \
            --asset-class "$DIAG_ASSET_CLASS" \
            --out diagnostics-out > diagnostics-out/stdout.md

      - name: Publish report to the job summary
        if: always()
        env:
          DIAG_VERSION: ${{ inputs.version }}
          DIAG_SYMBOL: ${{ inputs.symbol }}
          DIAG_ASSET_CLASS: ${{ inputs.asset_class }}
        run: |
          set -euo pipefail
          {
            echo "## Production Gold diagnostics — v$DIAG_VERSION / $DIAG_ASSET_CLASS/$DIAG_SYMBOL"
            echo ""
            echo "Read-only evidence report (connection string, credentials and personal data removed)."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f diagnostics-out/gold-v8-production-evidence.md ]; then
            cat diagnostics-out/gold-v8-production-evidence.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_The diagnostic produced no report; see the log above._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v8-production-evidence
          path: |
            diagnostics-out/gold-v8-production-evidence.json
            diagnostics-out/gold-v8-production-evidence.md
            diagnostics-out/stdout.md
          if-no-files-found: warn
          retention-days: 30
