name: CI

on:
  push:
    branches: [main, "ci/**", "arena/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: test (Node 22, ubuntu, embedded-postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PostgreSQL/libpq runtime for embedded-postgres
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y libpq-dev build-essential python3
          locale -a
          sudo locale-gen C.utf8 en_US.UTF-8 || true
          sudo update-locale || true
          locale -a

      - name: Install dependencies (npm ci)
        run: |
          set -eux
          npm ci
          ls -lh node_modules/@embedded-postgres/linux-x64/native/bin/ || true
          node_modules/@embedded-postgres/linux-x64/native/bin/initdb --version || true

      - name: Verify dev dependencies (tsx, typescript)
        run: |
          set -eux
          npx tsx --version
          npx tsc --version
          node --version
          npm --version

      - name: Typecheck (all workspaces)
        run: |
          set -eux
          npm run typecheck

      - name: Test (all workspaces, including safety)
        id: test
        run: |
          set -eux
          echo "availableParallelism=$(node -e 'console.log(require("os").availableParallelism())')"
          set +e
          taskset -c 0 npm test 2>&1 | tee /tmp/test.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "EXIT_CODE=$EXIT_CODE" | tee -a /tmp/test.log
          echo "=== SUMMARY ==="
          grep -E "^# (tests|pass|fail|suites)|^> @veltrixeye|EXIT_CODE|not ok" /tmp/test.log | tail -100 || true
          echo "=== FAILING TESTS ==="
          grep -B5 -A20 "not ok" /tmp/test.log | head -n 500 || echo "no not ok found"
          tail -n 500 /tmp/test.log > /tmp/test-tail.log || true
          grep -B5 -A30 "not ok" /tmp/test.log > /tmp/fail.log || true
          exit $EXIT_CODE

      - name: Upload test log artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: |
            /tmp/test.log
            /tmp/fail.log
            /tmp/test-tail.log
          retention-days: 7

      - name: Post failure details as PR comment (if failed)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let fail = '';
            let tail = '';
            try { fail = fs.readFileSync('/tmp/fail.log', 'utf8'); } catch (e) { fail = `no fail.log: ${e.message}`; }
            try { tail = fs.readFileSync('/tmp/test-tail.log', 'utf8'); } catch (e) { tail = `no tail: ${e.message}`; }
            const body = `❌ CI test step failed on \`${{ github.head_ref || github.ref_name }}\` @ \`${{ github.sha }}\`\n\n**Failing tests (grep not ok):**\n\`\`\`\n${fail.slice(0, 20000)}\n\`\`\`\n\n**Tail (last 500 lines):**\n\`\`\`\n${tail.slice(0, 20000)}\n\`\`\`\n`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 65000)
            });
