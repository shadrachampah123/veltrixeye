name: CI

on:
  push:
    branches: [main, "ci/**", "arena/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: test (Node 22, ubuntu, embedded-postgres)
    # Keep the embedded-PostgreSQL runner stable through the ubuntu-latest
    # migration; validate Ubuntu 26.04 separately before changing this pin.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install PostgreSQL/libpq runtime for embedded-postgres
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y libpq-dev build-essential python3
          locale -a
          sudo locale-gen C.utf8 en_US.UTF-8 || true
          sudo update-locale || true
          locale -a

      - name: Install dependencies (npm ci)
        run: |
          set -eux
          npm ci
          ls -lh node_modules/@embedded-postgres/linux-x64/native/bin/ || true
          node_modules/@embedded-postgres/linux-x64/native/bin/initdb --version || true

      - name: Verify dev dependencies (tsx, typescript)
        run: |
          set -eux
          npx tsx --version
          npx tsc --version
          node --version
          npm --version

      - name: Typecheck (all workspaces)
        run: |
          set -eux
          npm run typecheck

      - name: Lint
        run: |
          set -eux
          npm run lint

      - name: Verify Dockerfile includes Paystack workspace (regression for PR #46 fix)
        run: |
          set -eux
          echo "Checking Dockerfile for Paystack workspace packaging..."
          grep -F "packages/providers/paystack/package.json" Dockerfile
          grep -F "packages/providers/paystack/src" Dockerfile
          echo "Dockerfile contains Paystack entries"
          echo "Checking Node resolution of @veltrixeye/provider-paystack..."
          node -e "const p = require.resolve('@veltrixeye/provider-paystack'); console.log('resolved', p)"
          echo "Checking package files exist..."
          test -f packages/providers/paystack/package.json
          test -f packages/providers/paystack/src/index.ts
          echo "Paystack workspace present and resolvable"
          echo "Checking Dockerfile for Bank of Ghana source-reader workspace packaging..."
          grep -F "packages/providers/bank-of-ghana/package.json" Dockerfile
          grep -F "packages/providers/bank-of-ghana/src" Dockerfile
          node -e "const p = require.resolve('@veltrixeye/provider-bank-of-ghana'); console.log('resolved', p)"
          test -f packages/providers/bank-of-ghana/package.json
          test -f packages/providers/bank-of-ghana/src/index.ts
          echo "Bank of Ghana source-reader workspace present and resolvable"

      - name: Test (all workspaces, including safety)
        id: test
        run: |
          set -euxo pipefail
          echo "availableParallelism=$(node -e 'console.log(require("os").availableParallelism())')"
          # The test harness boots real PostgreSQL via embedded-postgres.
          #
          # This step used to run the whole suite in a retry loop (up to 10
          # attempts) to mask a flaky duplicate-key failure on
          # execution_orders_client_order_id_idx. That race was fixed in 5a0ae5f
          # (advisory-lock serialization + post-lock identity re-read in
          # PaperExecutionService.runFillTransaction) and is now pinned by the
          # deterministic TOCTOU regression test in
          # packages/core/test/paper-execution.test.ts ("a twin that read the
          # identity before the winner committed replays"). One authoritative
          # run replaces the loop: no retries, no masking. A failure here is a
          # real failure.
          rm -rf .test
          status=0
          taskset -c 0 npm test 2>&1 | tee /tmp/test.log || status=$?
          echo "=== SUMMARY ==="
          grep -E "^# (tests|pass|fail|suites)|^> @veltrixeye|not ok" /tmp/test.log | tail -50 || true
          # Capture the debugging artifacts on BOTH outcomes, then fail with the
          # suite's real exit status (pipefail keeps the pipe honest).
          tail -n 500 /tmp/test.log > /tmp/test-tail.log || true
          grep -B5 -A30 "not ok" /tmp/test.log > /tmp/fail.log || true
          exit $status

      - name: Upload test log artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-log
          path: |
            /tmp/test.log
            /tmp/fail.log
            /tmp/test-tail.log
          retention-days: 7

      - name: Post failure details as PR comment (if failed)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            let fail = '';
            let tail = '';
            try { fail = fs.readFileSync('/tmp/fail.log', 'utf8'); } catch (e) { fail = `no fail.log: ${e.message}`; }
            try { tail = fs.readFileSync('/tmp/test-tail.log', 'utf8'); } catch (e) { tail = `no tail: ${e.message}`; }
            const body = `❌ CI test step failed on \`${{ github.head_ref || github.ref_name }}\` @ \`${{ github.sha }}\` (single authoritative run, no retries)\n\n**Failing tests (grep not ok):**\n\`\`\`\n${fail.slice(0, 20000)}\n\`\`\`\n\n**Tail (last 500 lines):**\n\`\`\`\n${tail.slice(0, 20000)}\n\`\`\`\n`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 65000)
            });
