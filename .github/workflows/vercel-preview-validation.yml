name: Isolated Vercel Preview safety audit

# No mutating bootstrap is enabled. Vercel's first-deployment rule conflicts
# with the current prohibition on ANY Production deployment in a new project.
on:
  push:
    branches: ["arena/5648e2f6-veltrixeye"]
    paths:
      - .github/workflows/vercel-preview-validation.yml
      - scripts/deployment/**
      - apps/web/vercel.json

permissions:
  contents: read

concurrency:
  group: isolated-vercel-preview-5648e2f6
  cancel-in-progress: false

jobs:
  preview:
    # Do not retry a rejected credential on documentation/housekeeping pushes.
    # After authorization is repaired, an agent can explicitly request a new
    # GET-only audit with this marker in a code-changing commit message.
    if: contains(github.event.head_commit.message, '[vercel-safety-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify read-only safeguards offline (no credentials)
        run: node --test scripts/deployment/test/*.test.mjs

      - name: Diagnose minimum token permissions and inferred scope (four GETs only)
        # Never print token values, IDs, names, prefixes/suffixes, or raw responses.
        # An expected project-scope 403 is not treated as an invalid credential.
        # No team query is added to account metadata or inferred-scope reads.
        env:
          VERCEL_PREVIEW_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN_5648E2F6 }}
        run: node scripts/deployment/vercel-token-permissions.mjs > "$RUNNER_TEMP/vercel-preview-evidence.json"

      - name: Publish filtered evidence (no token or raw historical logs)
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const path = `${process.env.RUNNER_TEMP}/vercel-preview-evidence.json`;
          if (!existsSync(path)) process.exit(0);
          const e = JSON.parse(readFileSync(path, 'utf8'));
          const rows = (e.probes ?? []).map(p => `| ${p.label} | \`${p.path}\` | ${p.httpStatus ?? 'not available'} |`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            `## Read-only token-scope diagnosis: ${e.status}`,
            e.diagnosis ? `Diagnosis: \`${e.diagnosis.code}\` (${e.diagnosis.confidence}).` : '',
            e.blocker ? `Deployment gate: \`${e.blocker.code}\`.` : '',
            '| Read-only probe | Endpoint | HTTP status |',
            '| --- | --- | --- |', ...rows, '',
            'No new project or deployment was requested. No Vercel writes are possible in this job.',
            'Filtered evidence is also available in the vercel-preview-evidence artifact (7 days).', '',
          ].join('\n'));
          // Checks notices can be read through api.github.com even if artifact
          // storage hosts are outside the agent sandbox's network allowlist.
          const notice = JSON.stringify(e).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          process.stdout.write(`::notice file=docs/vercel-replacement-plan.md,line=1,title=Isolated Preview audit evidence::${notice}\n`);
          NODE

      - name: Upload filtered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-evidence
          path: ${{ runner.temp }}/vercel-preview-evidence.json
          if-no-files-found: ignore
          retention-days: 7
