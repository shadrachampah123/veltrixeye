# Render Blueprint — production deployment target for the Fastify API
# (apps/api). See docs/deployment.md for the full runbook.
#
# The Next.js web app is deliberately NOT defined here: it is deployed on
# Vercel (Root Directory: apps/web) and reaches this service server-side via
# the /api/* rewrite configured by API_INTERNAL_BASE. Nothing in this file
# contains a credential — `sync: false` asks the operator for the value in the
# Render Dashboard and stores it encrypted on the service.
#
# One-off manual choice: `plan: free` keeps this deployable without a payment
# method, but free web services spin down after ~15 minutes of inactivity and
# take ~1 minute to wake. Switch to `starter` (or change it in the dashboard)
# for an always-on production API — see docs/deployment.md.
services:
  - type: web
    name: veltrixeye-api
    runtime: docker
    branch: main
    plan: free
    # Readiness: database reachable + this build's migrations applied.
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '4000'
      # Secret 1 of 2. Paste the managed Postgres connection string
      # (Neon / Supabase / Render / RDS …) in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Secret 2 of 2 (M2 market data). Paste the Twelve Data API key in the
      # dashboard. Production user-facing display requires a Business
      # (Venture+) plan — see docs/provider-licensing.md. Without a key the
      # API still boots; market-data routes answer 502.
      - key: TWELVE_DATA_API_KEY
        sync: false
      # Managed Postgres over TLS. Use `verify-full` (plus NODE_EXTRA_CA_CERTS
      # pointing at the provider's CA) where the provider publishes one.
      - key: DATABASE_SSL_MODE
        value: require
      - key: DATABASE_POOL_MAX
        value: '10'
      - key: LOG_LEVEL
        value: info
      # --- M7.3 alert notification delivery ---
      # Leave SMTP_HOST and NOTIFICATION_FROM empty to run WITHOUT email
      # delivery: outbox jobs are still created and the worker records them
      # "unavailable" (never "delivered"). Fill them in (plus SMTP_USER /
      # SMTP_PASS) to switch delivery on — no code change, no redeploy of the
      # web app. See docs/notification-delivery.md.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: auto
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFICATION_FROM
        sync: false
      # Shared secret for POST /api/internal/notifications/deliveries/* so an
      # external scheduler can drain the outbox while the instance is asleep.
      # Empty = those routes return 404 (no administrative surface).
      - key: NOTIFICATION_WORKER_TOKEN
        sync: false
      - key: NOTIFICATION_WORKER_ENABLED
        value: 'true'
      - key: NOTIFICATION_WORKER_INTERVAL_MS
        value: '60000'
      - key: NOTIFICATION_WORKER_BATCH_SIZE
        value: '25'
      # --- M9.2 push + secret hardening ---
      # 32-byte base64 key for AES-256-GCM encryption of webhook/push secrets at rest.
      # Production MUST fail closed without it. Generate: openssl rand -base64 32
      # Render's encrypted env vars alone do NOT constitute DB secret protection.
      - key: WEBHOOK_SECRET_ENCRYPTION_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PUSH_ENABLED
        value: 'true'
      - key: PUSH_PROVIDER_TIMEOUT_MS
        value: '15000'
      # --- M7.5 / F3 live scanner + external scheduler invocation ---
      # Shared secret for POST /api/internal/scanner/run and
      # POST /api/internal/scanner/maintenance so an external scheduler can
      # wake a sleeping instance and run a scan cycle safely. Empty = those
      # routes return 404 (no administrative surface).
      - key: SCANNER_WORKER_TOKEN
        sync: false
      - key: SCANNER_ENABLED
        value: 'true'
      - key: SCANNER_INTERVAL_MS
        value: '300000'
      - key: SCANNER_LEASE_MS
        value: '1800000'
      - key: SCANNER_PROVIDER_TIMEOUT_MS
        value: '15000'
      - key: SCANNER_MAX_RETRIES
        value: '2'
      - key: SCANNER_RETRY_BASE_MS
        value: '1000'
      - key: SCANNER_RETRY_MAX_MS
        value: '10000'
      # --- P1 scheduled / pre-emptive candle ingestion ---
      # Operator-enabled for production after review: each scanner tick first
      # warms the candle cache so the scan's fetch-through reads become cache
      # hits. All four knobs are pinned explicitly to the reviewed values —
      # they are the reviewed production posture, not "whatever the code
      # default happens to be".
      - key: INGESTION_SCHEDULE_ENABLED
        value: 'true'
      # Max candles per instrument × timeframe per warm cycle (range 50–5000).
      # Smaller = fewer provider credits per warm cycle.
      - key: INGESTION_LOOKBACK_CANDLES
        value: '500'
      # Hard cap on actual provider requests in one warm cycle (range 1–1000).
      # Cache hits do not consume the budget; a cycle that reaches the cap
      # stops early instead of spending another credit.
      - key: INGESTION_MAX_REQUESTS_PER_CYCLE
        value: '8'
      # Minimum delay after the most recent warm-cycle attempt, in ms (range
      # 0–86400000). Failed and partial attempts count, so a broken provider
      # is not retried on every scanner tick.
      - key: INGESTION_MIN_INTERVAL_MS
        value: '900000'
      # --- M8.6 deployment-level global kill switch ---
      # 'true' pins the platform-wide emergency stop ON for every account
      # regardless of database state (new execution + paper simulation
      # refused); it can then only be released by editing this value and
      # redeploying — no API or DB row can clear it. Default 'false'.
      # It never enables anything: live execution stays impossible.
      - key: EXECUTION_GLOBAL_KILL_SWITCH
        value: 'false'
    # Only rebuild the API when something it actually ships changed; the web
    # app deploys independently on Vercel.
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - Dockerfile
        - .dockerignore
        - package.json
        - package-lock.json
        - tsconfig.base.json
